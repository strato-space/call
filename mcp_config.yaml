mcpServers:
  # ---------------------------------------------------------------------------
  # How to update Claude Desktop config from this file
  # 1) Take only entries with 'enabled: true' below.
  # 2) Build JSON with `mcpServers` entries mapping command/args/serverUrl.
  # 3) Script uses current directory as mcp filesystem root.
  # 4) Save to %APPDATA%\Claude\claude_desktop_config.json
  # 5) Optionally keep a local copy at call/claude_desktop_config.json
  # ---------------------------------------------------------------------------
  
  # npx -y @modelcontextprotocol/server-filesystem .
  fs:
    enabled: true
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
    env: {}
    capabilities: |
      Чтение/запись файлов в локальной файловой системе
      Позволяет AgentFab оптимизировать одновременно много промптов
      Позволяет работать с сохраненными артефактами - промпты, планы, идеи совместно AI + man
      Доступ к документам, конфигурациям, артефактам проекта

  # npx -y @modelcontextprotocol/server-sequential-thinking
  seq:
    enabled: true
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
    env: {}
    capabilities: |
      Пошаговое рассуждение для сложных задач
      Позволяет подсмотреть как он думает
      Декомпозиция проблем, логический вывод

  # npx -y @modelcontextprotocol/server-brave-search
  web_search:
    enabled: false
    command: npx
    args: ["-y", "@modelcontextprotocol/server-brave-search"]
    env:
      BRAVE_API_KEY: ""
    capabilities: |
      Поиск информации в интернете
      Позволяет работать новостным агрегаторам, обогащает идеями
      Исследование трендов, технологий, best practices

  # uv --directory mcp-crm-task run main.py
  crm-task:
    enabled: false
    command: uv
    args:
      - --directory
      - ./mcp-crm-task
      - run
      - main.py
    capabilities: |
      Управление задачами в Strato CRM
      Позволяет создавать задачи, читать перечень открытых задач
      CRUD операции, фильтрация, индексы (project, assignee, dedup)

  # skip --active --inexact too hard to sync all
  # uv --directory telegram-mcp-ro sync 
  # uv --directory telegram-mcp-ro run main.py
  # note: the app should load call/.env itself (e.g., via python-dotenv)
  tg-ro:
    enabled: true
    command: uv
    args:
      - --directory
      - ./telegram-mcp-ro
      - run
      -  main.py
    capabilities: |
      Чтение сообщений из Telegram чатов
      Позволяет выгребать сообщения из чатов на любую глубину, за вчера, за неделю, на конкретную дату
      Позволяет проводить поиск по ключевым словам
      Получение участников, истории, топиков
      Ограничен только r/o операциями, для безопасного добавления в чаты с заказчиками
      ../

  # uv --directory telegram-mcp sync 
  # uv --directory telegram-mcp run main.py
  # note: the app should load call/.env itself (e.g., via python-dotenv)
  tg-rw:
    enabled: false
    command: uv
    args:
      - --directory
      - ./telegram-mcp
      - run
      - main.py
    capabilities: |
      Отправка сообщений в Telegram
      Создание чатов, топиков, каналов, вход - выходы в чаты и каналы, управление пользователями
      Позволяет отправлять любые сообщения и в целом сделать любые действия от имени пользователя, входить-выходить в чаты, подписываться на каналы, извлекать инфу из каналов
      Перечень функций: https://github.com/chigwell/telegram-mcp
      
  # uv --directory mcp-telegram-bot sync 
  # uv --directory mcp-telegram-bot run main.py
  # note: the app should load call/.env itself (e.g., via python-dotenv)
  tgbot:
    enabled: true
    command: uv
    args:
      - --directory
      - ./mcp-telegram-bot
      - run
      - mcp-telegram-bot
      - start
    capabilities: |
      Рассылка через Telegram ботом сообщений в Text, HTML и Markdown2 формататх
      Отправка сообщений, создание навигационных меню под сообщением - url кнопки
      Интеграция бота с промптами с любыми для автоматизации коммуникаций

  # # OS env var:
  # API_ACCESS_TOKEN=123123142356365864895789678967
  # uv --directory voice sync
  # uv --directory voice run -m mcp_voicebot.server
  voice:
    enabled: true
    command: uv
    args:
      - --directory
      - ./voice
      - run
      - -m
      - mcp_voicebot.server
    capabilities: |
      Доступ к транскрипциям voice-диалогов
      Позволяет из промпта получить последние диалоги за сутки, за неделю, все диалоги по проекту
      Позволяет выбрать из промпта любой диалог использовать его как входные данные
      Проекты, персоны, поиск сессий, dialogue_reference

  # python -m call.mcp.server
  # note: должен запускаться из корневой директории strato-space, где установлен .venv
  call:
    enabled: true
    command: python
    args:
      - -m
      - call.mcp.server
    capabilities: |
      Запуск AI агентов и промптов из репозитория
      Инструменты: agents, prompts, call, exec, notify, read, write, reload, models
      - agents: список доступных агентов с фильтрацией по проекту и query
      - prompts: список промптов с фильтрацией по project/agent/prompt/state
      - call: вызов агента по имени с input и опциональным model override
      - exec: выполнение через JSON payload с селекторами (project/agent/prompt/target)
      - notify: отправка событий в runtime (session_transcription_done и др.)
      - read/write: прямой доступ к карточкам агентов/промптов в repo.db
      - reload: перезагрузка индекса репозитория
      - models: список доступных OpenAI моделей
      Поддержка session_id для Telegram-роутинга, model precedence (prompt>agent>project)
      Unified error envelope с structured diagnostics

  # # OS env var:
  # GOOGLE_APPLICATION_CREDENTIALS=/home/strato-space/call/wallet/service-account-key.json
  # uv --directory mcp-google-sheets sync
  # uv --directory mcp-google-sheets run mcp-google-sheets
  gsh:
    enabled: false
    command: uv
    args:
      - --directory
      - ./mcp-google-sheets
      - run
      - mcp-google-sheets
    capabilities: |
      Чтение/запись данных в Google Sheets по диапазонам ячеек
      Позволяет опираться на реестры, планы, медиа-планы прямо в google sheets
      Интеграция с клиентскими таблицами, отчёты
      Перечень функций: https://github.com/xing5/mcp-google-sheets

  # uvx --env-file call/.env --from git+https://github.com/strato-space/mcp-google-sheets@main mcp-google-sheets
  gsh-uvx:
    # Google Sheets MCP (remote or local)
    # If you are using a remote MCP, keep only 'serverUrl' here and optionally add a 'bridge' later.
    # If you want to run a local process, provide command/args env like other *-local servers.
    enabled: false
    command: uvx
    args:
      - --env-file
      - ./call/.env
      - --from
      - git+https://github.com/strato-space/mcp-google-sheets@main
      - mcp-google-sheets
  
  voice-srv:
    enabled: false
    serverUrl: "https://voice-mcp.stratospace.fun"

  

  # python -m voice.src.mcp_voicebot.server
  voice-py:
    enabled: false
    command: python
    args: ["-m", "voice.src.mcp_voicebot.server"]

  # uvx --env-file D:prompt/.env mcp-server-git --repository D:server
  git-server-local:
    command: uvx
    args: ["--env-file", "D:prompt/.env", "mcp-server-git", "--repository", "D:server"]

  # uvx --env-file D:prompt/.env mcp-server-git --repository D:rms
  git-rms-local:
    command: uvx
    args: ["--env-file", "D:prompt/.env", "mcp-server-git", "--repository", "D:rms"]

  # npx -y @modelcontextprotocol/server-memory
  memory-local:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory"]
    env:
      MEMORY_FILE_PATH: "C:/Users/Leader/PycharmProjects/memory"

  # python -m mcp_server_time
  time-local:
    command: python
    args: ["-m", "mcp_server_time"]
    env: {}

  # npx -y @modelcontextprotocol/server-github
  github0:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "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"

  # uvx --env-file prompt/.env mcp-server-git --repository empty
  git-empty-local:
    command: uvx
    args: ["--env-file", "prompt/.env", "mcp-server-git", "--repository", "empty"]

  # uvx --env-file prompt/.env mcp-server-git --repository prompt
  git-prompt-local:
    command: uvx
    args: ["--env-file", "prompt/.env", "mcp-server-git", "--repository", "prompt"]

