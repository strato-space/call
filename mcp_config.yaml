mcpServers:
  # ---------------------------------------------------------------------------
  # How to update Claude Desktop config from this file
  # 1) Take only entries with 'enabled: true' below.
  # 2) Build JSON with `mcpServers` entries mapping command/args/serverUrl.
  # 3) Script uses current directory as mcp filesystem root.
  # 4) Save to %APPDATA%\Claude\claude_desktop_config.json
  # 5) Optionally keep a local copy at call/claude_desktop_config.json
  # ---------------------------------------------------------------------------
  
  # npx -y @modelcontextprotocol/server-filesystem .
  fs:
    enabled: true
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
    env: {}

  # npx -y @modelcontextprotocol/server-sequential-thinking
  seq:
    enabled: true
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
    env: {}

  # skip --active --inexact too hard to sync all
  # uv --directory telegram-mcp-ro sync 
  # uv --directory telegram-mcp-ro run main.py
  # note: the app should load call/.env itself (e.g., via python-dotenv)
  tg-ro:
    enabled: true
    command: uv
    args:
      - --directory
      - ./telegram-mcp-ro
      - run
      -  main.py

  # uv --directory telegram-mcp sync 
  # uv --directory telegram-mcp run main.py
  # note: the app should load call/.env itself (e.g., via python-dotenv)
  tg-rw:
    enabled: false
    command: uv
    args:
      - --directory
      - ./telegram-mcp
      - run
      - main.py
  
  # uv --directory mcp-telegram-bot sync 
  # uv --directory mcp-telegram-bot run main.py
  # note: the app should load call/.env itself (e.g., via python-dotenv)
  tgbot:
    enabled: true
    command: uv
    args:
      - --directory
      - ./mcp-telegram-bot
      - run
      - mcp-telegram-bot
      - start

  # # OS env var:
  # API_ACCESS_TOKEN=123123142356365864895789678967
  # uv --directory voice sync
  # uv --directory voice run -m mcp_voicebot.server
  voice:
    enabled: true
    command: uv
    args:
      - --directory
      - ./voice
      - run
      - -m
      - mcp_voicebot.server

  # # OS env var:
  # GOOGLE_APPLICATION_CREDENTIALS=/home/strato-space/call/wallet/service-account-key.json
  # uv --directory mcp-google-sheets sync
  # uv --directory mcp-google-sheets run mcp-google-sheets
  gsh:
    enabled: false
    command: uv
    args:
      - --directory
      - ./mcp-google-sheets
      - run
      - mcp-google-sheets

  # uvx --env-file call/.env --from git+https://github.com/strato-space/mcp-google-sheets@main mcp-google-sheets
  gsh-uvx:
    # Google Sheets MCP (remote or local)
    # If you are using a remote MCP, keep only 'serverUrl' here and optionally add a 'bridge' later.
    # If you want to run a local process, provide command/args env like other *-local servers.
    enabled: false
    command: uvx
    args:
      - --env-file
      - ./call/.env
      - --from
      - git+https://github.com/strato-space/mcp-google-sheets@main
      - mcp-google-sheets
  
  voice-srv:
    enabled: false
    serverUrl: "https://voice-mcp.stratospace.fun"

  

  # python -m voice.src.mcp_voicebot.server
  voice-py:
    enabled: false
    command: python
    args: ["-m", "voice.src.mcp_voicebot.server"]

  # uvx --env-file D:prompt/.env mcp-server-git --repository D:server
  git-server-local:
    command: uvx
    args: ["--env-file", "D:prompt/.env", "mcp-server-git", "--repository", "D:server"]

  # uvx --env-file D:prompt/.env mcp-server-git --repository D:rms
  git-rms-local:
    command: uvx
    args: ["--env-file", "D:prompt/.env", "mcp-server-git", "--repository", "D:rms"]

  # npx -y @modelcontextprotocol/server-memory
  memory-local:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory"]
    env:
      MEMORY_FILE_PATH: "C:/Users/Leader/PycharmProjects/memory"

  # python -m mcp_server_time
  time-local:
    command: python
    args: ["-m", "mcp_server_time"]
    env: {}

  # npx -y @modelcontextprotocol/server-github
  github0:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "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"

  # uvx --env-file prompt/.env mcp-server-git --repository empty
  git-empty-local:
    command: uvx
    args: ["--env-file", "prompt/.env", "mcp-server-git", "--repository", "empty"]

  # uvx --env-file prompt/.env mcp-server-git --repository prompt
  git-prompt-local:
    command: uvx
    args: ["--env-file", "prompt/.env", "mcp-server-git", "--repository", "prompt"]

  # docker run -i --rm -e GITHUB_PERSONAL_ACCESS_TOKEN ghcr.io/github/github-mcp-server
  github-mcp-server:
    command: docker
    args: ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "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"

  ev-s:
    serverUrl: "https://ev-mcp.stratospace.fun"

  fs-s:
    serverUrl: "https://fs-mcp.stratospace.fun"

  fe-s:
    serverUrl: "https://fe-mcp.stratospace.fun"

  git-s:
    serverUrl: "https://git-mcp.stratospace.fun"

  git-server-s:
    serverUrl: "https://git-server-mcp.stratospace.fun"

  git-rms-s:
    serverUrl: "https://git-rms-mcp.stratospace.fun"

  git-prompt-s:
    serverUrl: "https://git-prompt-mcp.stratospace.fun"

  mem-s:
    serverUrl: "https://mem-mcp.stratospace.fun"

  seq-s:
    serverUrl: "https://seq-mcp.stratospace.fun"

  tm-s:
    serverUrl: "https://tm-mcp.stratospace.fun"

  tg-s:
    serverUrl: "https://tg-mcp.stratospace.fun"

  voice-s:
    serverUrl: "https://voice-mcp.stratospace.fun"

  github-0:
    type: http
    url: "https://api.githubcopilot.com/mcp/"

  github:
    serverUrl: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer 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"
