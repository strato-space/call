mcpServers:
  # Public open-source MCP servers (example defaults)
  fs:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "."]

  seq:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]

  memory:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory"]
    env:
      MEMORY_FILE_PATH: "./.memory"

  time:
    command: uvx
    args: ["mcp-server-time"]

  fetch:
    command: uvx
    args: ["mcp-server-fetch"]

  media-gen:
    # Uses public repo via npx. Provide secrets in env file (OPENAI_API_KEY, etc).
    command: npx
    args: ["-y", "github:strato-space/media-gen-mcp", "--env-file", "/path/to/media-gen.env"]

  image:
    # Uses public repo via uvx. No secrets required for basic fetch/resize.
    command: uvx
    args:
      - --from
      - git+https://github.com/IA-Programming/mcp-images@main
      - python
      - -m
      - mcp_image

  web_search:
    enabled: false
    command: npx
    args: ["-y", "@modelcontextprotocol/server-brave-search"]
    env:
      BRAVE_API_KEY: ""
