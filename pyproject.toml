[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "call"
version = "0.0.17"
description = "AI Agent Runtime & Orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.8.1,<3",
  "openai-agents[voice]==0.6.1",
  "requests[socks]>=2.31.0",
  "httpx[socks]",
  "telegraph[aio]>=0.3.2",
  "python-telegram-bot",
  "python-dotenv",
  "PyYAML",
  "beautifulsoup4",
  "mcp>=1.22.0",
  "pydantic>=2.12.3,<3",
  "pydantic-settings[dotenv]>=2.5.2,<3",
  "fastapi",
  "uvicorn",
  "mcp-image",
  "mcp-server-time",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-anyio",
  "pytest-asyncio",
  "trio",
]

[project.scripts]
call = "call.cli.main:main"
call-telegram-bot = "call.telegram_bot.bot:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
"mcp-image" = { path = "/home/tools/mcp-images" }
